# flutter gen-l10n (runs automatically on run/build/test with `generate: true`).
# Spanish (Uruguayan) is the source language and the fallback for any
# untranslated message; English follows the phone's locale.
arb-dir: lib/l10n
template-arb-file: app_es_UY.arb
output-localization-file: app_localizations.dart
output-dir: lib/l10n/generated
